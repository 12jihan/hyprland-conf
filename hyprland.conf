# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]
windowrule { 
  name = "float machi"
  match:float = true
  match:title = ^MACHI.* 
}
# windowrule = match:float true, match:title ^Image Generator.*
# windowrulev2 = float, title:^Steam Settings
# In hyprland.conf
windowrule {
  name = "steam rules"
  match:class = ^(steam_app_)
  no_blur = ^(steam_app_)
  no_shadow = ^(steam_app_)
  no_anim = ^(steam_app_)
  no_dim = ^(steam_app_)
}
# windowrule = noblur, class:^(steam_app_)
# windowrule = noshadow, class:^(steam_app_)
# windowrule = noanim, class:^(steam_app_)
# windowrule = nodim, class:^(steam_app_)

