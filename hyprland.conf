# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

workspace = 1, monitor:DP-1, default:true, persistent:true
workspace = 2, monitor:DP-1, default:true, persistent:true
workspace = 3, monitor:DP-1, default:true, persistent:true
workspace = 4, monitor:DP-1, default:true, persistent:true
workspace = 5, monitor:DP-1, default:true, persistent:true
workspace = 6, monitor:DP-1, default:true, persistent:true
workspace = 11, monitor:HDMI-A-1, default:true, persistent:true
workspace = 12, monitor:HDMI-A-1, default:true, persistent:true
workspace = 13, monitor:HDMI-A-1, default:true, persistent:true

# Switch workspaces with mainMod + [0-9]

# Display 1
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

# Display 2
bind = CTRL $mainMod, 1, workspace, 11
bind = CTRL $mainMod, 2, workspace, 12
bind = CTRL $mainMod, 3, workspace, 13

# Move active window to a workspace with mainMod + SHIFT + [0-9]

# Display 1
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# Display 2
bind = CTRL $mainMod SHIFT, 1, movetoworkspace, 11 
bind = CTRL $mainMod SHIFT, 2, movetoworkspace, 12
bind = CTRL $mainMod SHIFT, 3, movetoworkspace, 13

# Ignore maximize requests from apps. You'll probably like this.
windowrule { 
  name = "ignore maximize requests"
  suppress_event = maximize 
  match:class = :.* 
}
# Fix some dragging issues with XWayland
windowrule { 
  name = "fix xwayland dragging issues"
  match:class = ^$,title:^$
  no_focus = true
  match:xwayland = true
  match:float = true
  match:fullscreen =  false
  match:pin = false
}

windowrule {
    name = camera-preview
    match:title = ^(camera-preview)$
    float = on
    size = 1920 1080
    move = 100%-660 100%-380
    pin = on
    # noborder = on
}

